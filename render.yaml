# Render blueprint — deploys the ISP Linda Tracker as a Static Site.
# Import via Render → Blueprints (or New → Static Site and point at this repo).
# No backend: the browser reads the live Google Sheet via the gviz JSONP
# endpoint and parses Excel/CSV uploads with SheetJS.
services:
  - type: web
    runtime: static
    name: isp-linda-tracker
    staticPublishPath: ./public
    # No build step — pure static assets.
    buildCommand: ""
    autoDeploy: true
    routes:
      # SPA fallback so any path serves the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
