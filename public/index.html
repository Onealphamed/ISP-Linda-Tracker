<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESC Dashboard · Hetero ISP — Prof. Linda</title>
  <meta name="description" content="ESC Dashboard — live project-management tracker for the Hetero ISP (Prof. Linda) / ESC endorsement program." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">ESC</div>
      <div class="brand-text">
        <h1 id="projectTitle">ESC Dashboard</h1>
        <p id="projectSub"><span id="phaseChip" class="chip chip-phase"></span></p>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="search-box">
        <svg viewBox="0 0 24 24" class="ic"><path d="M21 21l-4.3-4.3M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
        <input id="globalSearch" type="text" placeholder="Search deliverable, owner, status…" autocomplete="off" />
      </div>
      <button id="refreshBtn" class="btn btn-ghost" title="Refresh from live sheet">
        <svg viewBox="0 0 24 24" class="ic"><path d="M21 12a9 9 0 11-2.6-6.4M21 3v6h-6"/></svg>
        <span class="lbl">Refresh</span>
      </button>
      <label class="btn btn-ghost" title="Upload a workbook">
        <svg viewBox="0 0 24 24" class="ic"><path d="M12 16V4m0 0L8 8m4-4l4 4M4 20h16"/></svg>
        <span class="lbl">Upload Excel</span>
        <input id="uploadInput" type="file" accept=".xlsx,.xls,.xlsm,.csv" hidden />
      </label>
      <button id="themeBtn" class="btn btn-icon" title="Toggle theme">
        <svg viewBox="0 0 24 24" class="ic ic-sun"><path d="M12 3v2m0 14v2M5.6 5.6l1.4 1.4m10 10l1.4 1.4M3 12h2m14 0h2M5.6 18.4l1.4-1.4m10-10l1.4-1.4M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
        <svg viewBox="0 0 24 24" class="ic ic-moon"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="executive">Executive</button>
    <button class="tab" data-view="timeline">Timeline</button>
    <button class="tab" data-view="deliverables">Deliverables</button>
    <button class="tab" data-view="calendar">Calendar</button>
    <button class="tab" data-view="pending">Pending Actions</button>
  </nav>

  <div class="filterbar" id="filterbar">
    <select class="fsel" data-filter="status"><option value="">All Status</option></select>
    <select class="fsel" data-filter="owner"><option value="">All Owners</option></select>
    <select class="fsel" data-filter="health"><option value="">All Health</option></select>
    <select class="fsel" data-filter="month"><option value="">All Months</option></select>
    <button id="clearFilters" class="btn btn-tiny">Clear</button>
    <div class="filter-meta">
      <span id="sourceBadge" class="src-badge"></span>
      <span id="updatedAt" class="updated"></span>
    </div>
  </div>

  <main id="main">
    <section class="view active" id="view-executive"></section>
    <section class="view" id="view-timeline"></section>
    <section class="view" id="view-deliverables"></section>
    <section class="view" id="view-calendar"></section>
    <section class="view" id="view-pending"></section>
  </main>

  <div id="loader" class="loader"><div class="spinner"></div><p id="loaderText">Loading live data…</p></div>
  <div id="toast" class="toast"></div>

  <div id="modal" class="modal-overlay">
    <div class="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
